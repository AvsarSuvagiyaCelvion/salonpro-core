<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="salonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b3135b"/>
      <stop offset="100%" stop-color="#e63985"/>
    </linearGradient>
  </defs>
  <!-- Rounded Background Container -->
  <rect width="64" height="64" rx="16" fill="url(#salonGrad)"/>
  
  <!-- Stylized Salon Scissors Icon -->
  <g fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Handle 1 (Bottom Left Loop) -->
    <circle cx="21" cy="45" r="7"/>
    <!-- Handle 2 (Bottom Right Loop) -->
    <circle cx="43" cy="45" r="7"/>
    <!-- Blade 1 -->
    <line x1="26" y1="40" x2="44" y2="15"/>
    <!-- Blade 2 -->
    <line x1="38" y1="40" x2="20" y2="15"/>
    <!-- Center Pivot Dot -->
    <circle cx="32" cy="31" r="2" fill="#ffffff"/>
  </g>

  <!-- Luxury Accent Sparkle -->
  <path d="M49 13 Q49 18 44 18 Q49 18 49 23 Q49 18 54 18 Q49 18 49 13 Z" fill="#ffd700"/>
</svg>
